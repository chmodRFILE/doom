<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Crafting Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .crafting-table {
            background: linear-gradient(135deg, #2c3e50 0%, #1a2530 100%);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 20px;
            margin: 20px 0;
        }
        
        .recipe-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .ingredient {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 2px 8px;
            margin: 2px;
            font-size: 0.9em;
        }
        
        .craft-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            transition: all 0.3s ease;
        }
        
        .craft-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .inventory-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin: 5px;
            text-align: center;
        }
        
        .crafting-progress {
            height: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div class="container py-4">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h1><i class="fas fa-spider"></i> Spider Crafting Table</h1>
                <p class="text-muted">Craft spider-related items and equipment</p>
            </div>
        </div>

        <div class="row">
            <!-- Inventory Section -->
            <div class="col-md-4">
                <div class="crafting-table">
                    <h3><i class="fas fa-backpack"></i> Your Inventory</h3>
                    <div id="inventory-items" class="mt-3">
                        <!-- Inventory items will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Crafting Recipes Section -->
            <div class="col-md-8">
                <div class="crafting-table">
                    <h3><i class="fas fa-cogs"></i> Crafting Recipes</h3>
                    <div id="recipes-container" class="mt-3">
                        <!-- Recipes will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Crafting table JavaScript
        class CraftingTable {
            constructor() {
                this.inventory = [];
                this.recipes = [];
                this.init();
            }

            async init() {
                await this.loadInventory();
                await this.loadRecipes();
                this.renderInventory();
                this.renderRecipes();
            }

            async loadInventory() {
                try {
                    const response = await fetch('/crafting/inventory');
                    const data = await response.json();
                    if (data.success) {
                        this.inventory = data.inventory;
                    }
                } catch (error) {
                    console.error('Error loading inventory:', error);
                }
            }

            async loadRecipes() {
                try {
                    const response = await fetch('/crafting/recipes');
                    const data = await response.json();
                    if (data.success) {
                        this.recipes = data.recipes;
                    }
                } catch (error) {
                    console.error('Error loading recipes:', error);
                }
            }

            renderInventory() {
                const container = document.getElementById('inventory-items');
                if (!container) return;

                if (this.inventory.length === 0) {
                    container.innerHTML = '<p class="text-muted">Your inventory is empty</p>';
                    return;
                }

                let html = '';
                this.inventory.forEach(item => {
                    html += `
                        <div class="inventory-item">
                            <strong>${item.name}</strong><br>
                            <span class="badge bg-primary">${item.quantity}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            renderRecipes() {
                const container = document.getElementById('recipes-container');
                if (!container) return;

                if (this.recipes.length === 0) {
                    container.innerHTML = '<p class="text-muted">No recipes available</p>';
                    return;
                }

                let html = '';
                this.recipes.forEach(recipe => {
                    html += `
                        <div class="recipe-card p-3">
                            <h5>${recipe.name}</h5>
                            <p class="small text-muted">${recipe.description}</p>
                            
                            <div class="mb-2">
                                <strong>Ingredients:</strong><br>
                                ${recipe.ingredients.map(ing => 
                                    `<span class="ingredient">${ing.item} x${ing.quantity}</span>`
                                ).join('')}
                            </div>
                            
                            <div class="mb-2">
                                <strong>Result:</strong><br>
                                <span class="ingredient">${recipe.result.item} x${recipe.result.quantity}</span>
                            </div>
                            
                            <button class="btn craft-btn w-100 mt-2" onclick="craftItem('${recipe.id}')">
                                <i class="fas fa-hammer"></i> Craft
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        // Initialize crafting table when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const craftingTable = new CraftingTable();
        });

        // Craft an item
        async function craftItem(recipeId) {
            try {
                const response = await fetch('/crafting/craft', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipeId: recipeId,
                        inventory: [] // Will be updated from current state
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    alert('Crafting successful!');
                    // Reload inventory and recipes
                    location.reload();
                } else {
                    alert('Crafting failed: ' + data.error);
                }
            } catch (error) {
                console.error('Error crafting item:', error);
                alert('Error crafting item');
            }
        }

        // Check if can craft
        async function canCraft(recipeId) {
            try {
                const response = await fetch('/crafting/can-craft', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipeId: recipeId,
                        inventory: []
                    })
                });

                const data = await response.json();
                return data.canCraft;
            } catch (error) {
                console.error('Error checking crafting:', error);
                return false;
            }
        }
    </script>
</body>
</html>
